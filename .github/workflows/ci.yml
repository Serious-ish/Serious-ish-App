name: CI

# Runs on every pull request and every push to main (FT-001).
# Branch protection on main requires every job below to pass before a merge.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  checks:
    name: Type-check, lint, format and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Tests
        run: pnpm test

      - name: Public variable check
        run: pnpm check:public-env

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # This job installs no packages, so turn off the cache setup-node would otherwise
      # enable from package.json's packageManager field (it needs pnpm on the PATH).
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install gitleaks
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check --strict
          tar -xzf "$tarball" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full history
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Scan working tree
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Prove the scan catches every required key type
        run: bash scripts/test-secret-scan.sh

  database:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: 2.40.7

      # Applies every migration to an empty database, the same way staging and production do.
      - name: Start the database and apply migrations
        run: supabase db start

      - name: Access-rule and audit tests (pgTAP)
        run: supabase test db

      - name: Lint database functions
        run: supabase db lint --schema public,private --fail-on error

      - name: Generated types are up to date
        run: |
          supabase gen types typescript --local --schema public > packages/shared/src/types/database.generated.ts
          git diff --exit-code -- packages/shared/src/types/database.generated.ts \
            || { echo "Run 'pnpm db:types' and commit the result."; exit 1; }

  pr-title:
    name: Pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Pull requests are squash-merged, so the title becomes the commit subject on main.
      - name: Check the title follows the commit format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # Accepted exceptions. Each needs a reason and a removal condition.
          #
          # GHSA-fc5q-39xc-vjpf (picomatch ReDoS, high), accepted 18 November 2026.
          #   Every picomatch release up to 4.0.7 is affected and no fixed version exists.
          #   It reaches us only through build and test tooling bundled with Expo SDK 58
          #   (Metro, the Expo CLI, Jest), which matches file patterns we write ourselves.
          #   It is not in the member app's runtime or the moderation page's production
          #   dependencies. Remove this line once picomatch ships a fix (Dependabot will open
          #   the update pull request).
          allow-ghsas: GHSA-fc5q-39xc-vjpf
